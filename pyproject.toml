[project]
name = "lastofus"
version = "0.1.0"
description = "라오어 무한매수법 백테스트 & 대시보드"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "plotly>=5.0",
    "jinja2>=3.1",
    "requests>=2.28",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lastofus"]
