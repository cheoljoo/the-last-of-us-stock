server {
    listen 80;
    listen [::]:80;
    server_name psncs.iptime.org;

    # ── /stock_candle — Candle 대시보드 ────────────────────────────────────
    location = /stock_candle {
        return 301 /stock_candle/;
    }

    location /stock_candle/ {
        alias /home/cheoljoo/code/candle/dashboard_site/;
        index index.html;
        try_files $uri $uri/ =404;
        charset utf-8;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma no-cache;
    }


    # ── /infinite_buying — 라오어 무한매수법 백테스트 대시보드 ─────────────
    location = /infinite_buying {
        return 301 /infinite_buying/;
    }

    location /infinite_buying/ {
        alias /home/cheoljoo/code/the-last-of-us-stock/reports/html/;
        index index.html;
        try_files $uri $uri/ =404;
        charset utf-8;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma no-cache;
    }

    # ── /news — News Arcade 뉴스 서비스 ───────────────────────────────────
    location = /news {
        return 301 /news/;
    }

    location /news/data/ {
        alias /home/cheoljoo/code/my-news/data/;
        charset utf-8;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location /news/ {
        alias /home/cheoljoo/code/my-news/web/;
        index index.html;
        try_files $uri $uri/ =404;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }
}
